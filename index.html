<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="秀岳設計室內裝修有限公司官方網站，提供商業及住宅、室內設計、室內裝修工程。查看精選案例、專業證照與施工流程，讓設計真正落地。">

<style>
  :root{
    --bg:#0c0f12;
    --panel:rgba(18,22,26,.86);
    --panel2:rgba(18,22,26,.72);
    --line:rgba(255,255,255,.10);
    --text:#e8eaed;
    --muted:#a9b0b6;
    --accent:#8fd3c8;
    --accent2:#c9a86a;
    --radius:18px;
    --shadow: 0 16px 40px rgba(0,0,0,.55);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",Arial,sans-serif;
    background: radial-gradient(1200px 600px at 20% 0%, rgba(143,211,200,.10), transparent 60%),
                radial-gradient(900px 500px at 90% 10%, rgba(201,168,106,.08), transparent 55%),
                var(--bg);
    color:var(--text);
    overflow-x:hidden;
  }
  a{ color:inherit; text-decoration:none; }

  /* ===== Header ===== */
  header{
    position:sticky;
    top:0;
    z-index:50;
    backdrop-filter: blur(12px);
    background:rgba(12,15,18,.82);
    border-bottom:1px solid var(--line);
  }
  .nav{
    max-width:1200px;
    margin:0 auto;
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
  }
  .brand{
    display:flex;
    flex-direction:column;
    line-height:1.15;
    min-width:220px;
  }
  .brand .t1{
    font-size:18px;
    font-weight:700;
    letter-spacing:.5px;
    margin:0;
  }
  .brand .t2{
    margin-top:4px;
    font-size:12px;
    color:var(--muted);
  }

  .menu{
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }
  .menu a.link{
    font-size:14px;
    opacity:.86;
  }
  .menu a.link:hover{ opacity:1; }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:10px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.04);
    color:var(--text);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  .btn:hover{ background:rgba(255,255,255,.06); }
  .btn.primary{
    border-color:rgba(143,211,200,.75);
    background:linear-gradient(180deg, rgba(143,211,200,.95), rgba(143,211,200,.75));
    color:#071210;
    font-weight:700;
  }

  /* ===== Layout ===== */
  .wrap{ max-width:1200px; margin:0 auto; padding:0 22px; }

  /* ===== Hero ===== */
  .hero{
    margin:28px auto 8px;
    display:grid;
    grid-template-columns: 1.22fr .78fr;
    gap:22px;
    align-items:stretch;
  }
  .heroLeft{
    position:relative;
    border-radius:var(--radius);
    overflow:hidden;
    min-height:430px;
    box-shadow: var(--shadow);
    border:1px solid rgba(255,255,255,.10);
    background:
      linear-gradient(180deg, rgba(0,0,0,.20), rgba(0,0,0,.78)),
      url("images/hero-bg.jpg") center/cover no-repeat;
  }
  .heroLeft::after{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(600px 300px at 15% 20%, rgba(143,211,200,.16), transparent 60%),
                radial-gradient(700px 350px at 85% 20%, rgba(201,168,106,.10), transparent 62%);
    pointer-events:none;
    mix-blend-mode: screen;
    opacity:.55;
  }
  .heroContent{
    position:absolute;
    inset:0;
    padding:34px 34px 30px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:14px;
  }
  .tag{
    display:inline-flex;
    align-items:center;
    gap:10px;
    width:100%;
    max-width:560px;
    padding:10px 14px;
    border-radius:999px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.10);
    font-size:13px;
    color:#eaf4f2;
  }
  .tag .dot{
    width:8px;height:8px;border-radius:99px;background:var(--accent);
    box-shadow:0 0 0 4px rgba(143,211,200,.18);
  }
  .heroTitle{
    margin:0;
    font-size:40px;
    line-height:1.15;
    letter-spacing:.6px;
  }
  .heroDesc{
    margin:0;
    max-width:610px;
    color:rgba(233,237,241,.82);
    line-height:1.75;
    font-size:15px;
  }
  .heroActions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:8px;
  }

  .heroRight{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .card{
    position:relative;
    border-radius:var(--radius);
    padding:18px 18px 18px;
    border:1px solid rgba(255,255,255,.10);
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    box-shadow: 0 10px 28px rgba(0,0,0,.45);
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:inherit;
    background: radial-gradient(420px 220px at 20% 20%, rgba(143,211,200,.16), transparent 60%),
                radial-gradient(420px 220px at 90% 10%, rgba(201,168,106,.10), transparent 62%);
    pointer-events:none;
    opacity:.55;
  }
  .card .inner{ position:relative; }
  .card h3{ margin:0 0 6px; font-size:16px; letter-spacing:.4px; }
  .card p{ margin:0; font-size:13px; color:var(--muted); line-height:1.65; }

  /* ===== Section ===== */
  section.block{ padding:34px 0 10px; }
  .h2{
    margin:0 0 16px;
    font-size:26px;
    letter-spacing:.6px;
  }
  .sub{
    margin:0 0 18px;
    color:var(--muted);
    font-size:14px;
    line-height:1.7;
  }

  /* ===== Grid Cards ===== */
  .grid{
    display:grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap:18px;
  }
  .tile{
    border-radius:18px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.10);
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
    box-shadow: 0 12px 30px rgba(0,0,0,.45);
    cursor:pointer;
    transition: transform .18s ease, box-shadow .18s ease;
    position:relative;
  }
  .tile:hover{ transform: translateY(-2px); box-shadow: 0 18px 44px rgba(0,0,0,.55); }

  /* 案例縮圖（維持原本那種滿版照片感） */
  .thumb{
    width:100%;
    height:170px;
    object-fit:cover;
    display:block;
    background:rgba(255,255,255,.03);
  }

  /* ✅ 證照縮圖（小張：不裁切、不撐滿） */
  .certThumbWrap{
    width:100%;
    height:auto !important;     /* 🔥關鍵：不要固定高度 */
    overflow:visible !important;/* 🔥不要裁切 */
    border-radius:14px;
    background:rgba(0,0,0,.25);
    padding:10px;
  }
  .certThumb{
    width:100% !important;      /* 讓整張填滿卡片寬度 */
    height:auto !important;     /* 依比例自動撐高 */
    object-fit:contain !important;
    display:block;
  }
  .tileBody{ padding:12px 14px 14px; }
  .tileTitle{ margin:0 0 8px; font-size:15px; letter-spacing:.4px; }
  .tileMeta{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    color:rgba(233,237,241,.70);
    font-size:13px;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.10);
    background:rgba(0,0,0,.18);
  }
  .chip .miniDot{
    width:7px;height:7px;border-radius:99px;background:var(--accent);
    box-shadow:0 0 0 3px rgba(143,211,200,.14);
  }

  /* ===== Flow ===== */
  .flow{
    display:grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap:16px;
  }
  .step{
    border-radius:18px;
    border:1px solid rgba(255,255,255,.10);
    background:rgba(18,22,26,.72
